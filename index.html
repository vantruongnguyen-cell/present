    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #fff2f4 0%, #ffd6e0 50%, #fecdd3 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Canvas hiệu ứng hoa rơi & pháo hoa */
        #petalCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Glassmorphism Card Premium */
        .glass-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 25px 50px -12px rgba(183, 110, 121, 0.25),
                        0 0 35px rgba(212, 175, 55, 0.15);
        }

        /* Text Gradients */
        .text-title-gradient {
            background: linear-gradient(135deg, #e11d48 0%, #be123c 40%, #b76e79 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Khung Polaroid Xoay nhẹ ngẫu nhiên */
        .polaroid-frame {
            background: #ffffff;
            padding: 8px 8px 16px 8px;
            box-shadow: 0 12px 30px rgba(183, 110, 121, 0.18), 0 4px 12px rgba(0,0,0,0.04);
            border: 2px solid rgba(212, 175, 55, 0.35);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .polaroid-frame:hover {
            transform: translateY(-5px) scale(1.03) rotate(0deg) !important;
            border-color: rgba(212, 175, 55, 0.9);
            box-shadow: 0 20px 40px rgba(183, 110, 121, 0.3);
            z-index: 20;
        }

        /* Nút Bấm Lớn Nổi Bật */
        .btn-open-card {
            background: linear-gradient(135deg, #e11d48 0%, #be123c 50%, #9f1239 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-open-card:hover {
            transform: translateY(-3px) scale(1.05);
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 50%, #be123c 100%);
        }

        /* Tùy chỉnh thanh cuộn cho mượt mà */

    <!-- JavaScript Render Data & Canvas Effect -->
    <script>
        // Render dữ liệu từ CONFIG
        document.addEventListener('DOMContentLoaded', () => {
            for (let i = 1; i <= 6; i++) {
                const img = document.getElementById(`cardImage${i}`);
                if (img) {
                    img.src = CONFIG[`IMAGE_URL_${i}`];
                    img.onerror = function() { 
                        this.src = `https://placehold.co/400x500/ffd6e0/8A4A53?text=Photo+${i}`; 
                    };
                }
                const caption = document.getElementById(`cardCaption${i}`);
                if (caption) {
                    caption.innerText = CONFIG[`CAPTION_${i}`];
                }
            }

            document.getElementById('cardPoem').innerText = CONFIG.POEM_TEXT;
            document.getElementById('cardWish').innerText = CONFIG.WISH_TEXT;
        });

        // Hàm Mở Thiệp khi Bấm Nút "Bấm Vào Đây"
        function openCard() {
            const welcomeScreen = document.getElementById('welcomeScreen');
            const cardScreen = document.getElementById('cardScreen');

            // Hiệu ứng ẩn màn hình chào
            welcomeScreen.classList.add('opacity-0', 'scale-90');
            
            setTimeout(() => {
                welcomeScreen.classList.add('hidden');
                
                // Hiện màn hình thiệp
                cardScreen.classList.remove('hidden');
                setTimeout(() => {
                    cardScreen.classList.remove('opacity-0', 'scale-95');
                    cardScreen.classList.add('opacity-100', 'scale-100');
                    
                    // Bắn pháo hoa ăn mừng
                    triggerFireworks();
                }, 50);
            }, 500);
        }

        /* ==================== CANVAS HOẠT HỌA CÁNH HOA, TRÁI TIM & PHÁO HOA ==================== */
        const canvas = document.getElementById('petalCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class FallingPetal {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -20;
                this.size = Math.random() * 12 + 6;
                this.speedY = Math.random() * 1.3 + 0.6;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
                this.opacity = Math.random() * 0.6 + 0.4;
                this.color = Math.random() > 0.3 ? '#f43f5e' : '#fda4af';
                this.type = Math.random();
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.rotation += this.rotationSpeed;

                if (this.y > height + 20) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;

                if (this.type > 0.5 && this.type <= 0.85) {
                    ctx.fillStyle = '#e11d48';
                    ctx.beginPath();
                    const topCurveHeight = this.size * 0.3;
                    ctx.moveTo(0, topCurveHeight);
                    ctx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
                    ctx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
                    ctx.bezierCurveTo(0, this.size, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
                    ctx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
                    ctx.closePath();
                    ctx.fill();
                } else if (this.type > 0.85) {
                    ctx.fillStyle = '#D4AF37';
                    ctx.beginPath();
                    for (let i = 0; i < 4; i++) {
                        ctx.lineTo(Math.cos((18 + i * 90) * Math.PI / 180) * this.size,
                                   Math.sin((18 + i * 90) * Math.PI / 180) * this.size);
                        ctx.lineTo(Math.cos((54 + i * 90) * Math.PI / 180) * (this.size/3),
                                   Math.sin((54 + i * 90) * Math.PI / 180) * (this.size/3));
                    }
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size / 2, this.size, Math.PI / 4, 0, 2 * Math.PI);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        class FireworkParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 6 + 2;
                this.friction = 0.95;
                this.gravity = 0.12;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
                this.color = ['#e11d48', '#f43f5e', '#fb7185', '#D4AF37', '#ffffff'][Math.floor(Math.random() * 5)];
                this.size = Math.random() * 4 + 2;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const petals = Array.from({ length: 45 }, () => new FallingPetal());
        let fireworks = [];

        function triggerFireworks() {
            const centerX = width / 2;
            const centerY = height / 2;
            for (let i = 0; i < 90; i++) {
                fireworks.push(new FireworkParticle(centerX, centerY));
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            
            petals.forEach(petal => {
                petal.update();
                petal.draw();
            });

            fireworks.forEach((fw, index) => {
                fw.update();
                fw.draw();
                if (fw.alpha <= 0) {
                    fireworks.splice(index, 1);
                }
            });

            requestAnimationFrame(animateCanvas);
        }

        window.onload = function() {
            animateCanvas();
        };
    </script>
</body>
